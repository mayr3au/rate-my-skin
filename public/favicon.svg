<svg width="64" height="64" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>
  </defs>
  <g style="animation: flowerSpin 12s linear infinite; transform-origin: 22px 22px">
    <ellipse cx="22" cy="14" rx="3.2" ry="8" stroke="#FFFFFF" stroke-width="2.2" fill="none" transform="rotate(0 22 22)" style="filter: drop-shadow(0px 1px 2px rgba(168,116,73,0.3))" />
    <ellipse cx="22" cy="14" rx="3.2" ry="8" stroke="#FFFFFF" stroke-width="2.2" fill="none" transform="rotate(60 22 22)" style="filter: drop-shadow(0px 1px 2px rgba(168,116,73,0.3))" />
    <ellipse cx="22" cy="14" rx="3.2" ry="8" stroke="#FFFFFF" stroke-width="2.2" fill="none" transform="rotate(120 22 22)" style="filter: drop-shadow(0px 1px 2px rgba(168,116,73,0.3))" />
    <ellipse cx="22" cy="14" rx="3.2" ry="8" stroke="#FFFFFF" stroke-width="2.2" fill="none" transform="rotate(180 22 22)" style="filter: drop-shadow(0px 1px 2px rgba(168,116,73,0.3))" />
    <ellipse cx="22" cy="14" rx="3.2" ry="8" stroke="#FFFFFF" stroke-width="2.2" fill="none" transform="rotate(240 22 22)" style="filter: drop-shadow(0px 1px 2px rgba(168,116,73,0.3))" />
    <ellipse cx="22" cy="14" rx="3.2" ry="8" stroke="#FFFFFF" stroke-width="2.2" fill="none" transform="rotate(300 22 22)" style="filter: drop-shadow(0px 1px 2px rgba(168,116,73,0.3))" />
    <circle cx="22" cy="22" r="2" fill="#FFFFFF" />
  </g>
  <style>
    @keyframes flowerSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</svg>
